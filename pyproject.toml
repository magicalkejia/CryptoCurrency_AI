[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant_system"
version = "0.1.5"
dependencies = [
    "ccxt==4.5.31",
    "pyarrow",
    "duckdb==1.4.4",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "python-dotenv==1.2.2",
    "tqdm==4.66.4",
    "quantstats",
    "ipython==8.12.3",
    "taskipy",

    # v6 additions
    "scikit-learn",
    "scipy",
    "lightgbm",
    "pytest",
    "playwright",

    # optional / future
    # "langgraph",
    # "flask",
]

[project.optional-dependencies]
# Real PatchTST (deep-learning) backend. Without it, PatchTST auto-falls back to
# the sklearn temporal model and the experiment still runs.
#   pip install -e ".[dl]"      (CPU torch is fine; GPU later on the school server)
dl = ["torch>=2.1"]

# Narrative modality: CryptoBERT sentiment scoring of news titles (etl/score_news.py).
#   pip install -e ".[narrative]"
# (emoji is a safety net for the BERTweet-style tokenizer; the fast tokenizer used by
#  score_news.py normally does not need it.)
narrative = ["torch>=2.1", "transformers>=4.36", "emoji>=2.0"]

# LLM event/narrative extraction (etl/extract_events_llm.py via DeepSeek). DeepSeek is
# OpenAI-compatible, so the official openai SDK is all that is needed.
#   pip install -e ".[llm]"
llm = ["openai>=1.0"]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["crypto*", "etl*", "backtest*"]
exclude = ["tests*", "app*", "examples*", "scripts*"]
namespaces = false

[tool.taskipy.tasks]
sysrun = "pip install -e ."
marketonly_dataupdate = "python main.py --mode crypto"
dataupdate =  "python main.py --mode crypto --fetch-derivatives"
onchain_dataupdate = "python main.py --mode crypto --skip-market --fetch-onchain --process-onchain --build-onchain-factors"
sentiment_dataupdate = "python main.py --mode crypto --skip-market --fetch-sentiment"
coindesk_archive = "python scripts/fetch_coindesk_archive.py"
chrome_cdp = "powershell -ExecutionPolicy Bypass -File scripts/open_chrome_cdp.ps1"
chrome_cdp_profile = "powershell -ExecutionPolicy Bypass -File scripts/show_chrome_cdp_profile.ps1"
coindesk_access = "python scripts/check_coindesk_access.py"
coindesk_compact = "python scripts/compact_coindesk_articles.py"
feature = "python main.py --mode crypto --skip-market --build-features --feature-builder multimodal"
realdata = "python run_on_real_data.py"
experiment = "python run_on_real_data.py --symbols BTC/USDT ETH/USDT SOL/USDT BNB/USDT"
selftest = "python run_on_real_data.py --synthetic"
agent = "python run_agent.py"
reference = "python scripts/reference_decision_exporter.py"
bt_signal = "python scripts/backtest_agent_decisions.py"
clean = "for /d /r . %d in (__pycache__) do @if exist \"%d\" rd /s /q \"%d\""

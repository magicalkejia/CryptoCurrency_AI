[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant_system"
version = "0.1.5"
dependencies = [
    "ccxt==4.5.31",
    "parquet==1.3.1",
    "pyarrow",
    "duckdb==1.4.4",
    "numpy==2.4.2",
    "pandas==3.0.1",
    "python-dotenv==1.2.2",
    "tqdm==4.66.4",
    "quantstats",
    "ipython==8.12.3",
    "taskipy",

    # v6 additions
    "scikit-learn",
    "scipy",
    "lightgbm",
    "pytest",

    # optional / future
    # "torch",
    # "langgraph",
    # "flask",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["crypto*", "etl*", "backtest*"]
exclude = ["tests*", "app*", "examples*", "scripts*"]
namespaces = false

[tool.taskipy.tasks]
sysrun = "pip install -e ."
marketonly_dataupdate = "python main.py --mode crypto"
dataupdate =  "python main.py --mode crypto --fetch-derivatives"
realdata = "python scripts/run_on_real_data.py"
agent = "python scripts/run_agent.py"
reference = "python scripts/reference_decision_exporter.py"
bt_signal = "python scripts/backtest_agent_decisions.py"
clean = "for /d /r . %d in (__pycache__) do @if exist \"%d\" rd /s /q \"%d\""